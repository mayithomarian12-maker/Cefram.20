    <div id="modalPasteleria" class="modal-bakery">
        <div class="modal-contenido-bakery">
            <span class="cerrar-bakery" onclick="cerrarModal()">&times;</span>
            <h2 id="modalTitulo">Nombre del Producto</h2>
            <p id="modalDescripcion">Descripción corta del postre.</p>
            <h3 id="modalPrecio">$0.00</h3>
        </div>
    </div>

    <script>
        // Muestra la ventana con la información del postre seleccionado
        function verProducto(nombre, descripcion, precio) {
            document.getElementById("modalTitulo").innerText = nombre;
            document.getElementById("modalDescripcion").innerText = descripcion;
            document.getElementById("modalPrecio").innerText = precio;
            document.getElementById("modalPasteleria").style.display = "block";
        }

        // Oculta la ventana
        function cerrarModal() {
            document.getElementById("modalPasteleria").style.display = "none";
        }

        // Cierra la ventana si el usuario hace click en la zona oscura exterior
        window.onclick = function(event) {
            const modal = document.getElementById("modalPasteleria");
            if (event.target == modal) {
                cerrarModal();
            }
        }
    </script>
